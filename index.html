<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Caffe Automata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="machine">
        <h1>Kávé Automata ☕</h1>

        <button id="coinBtn">💰 Érme bedobása</button>

        <div id="coffeeOptions" class="hidden">
            <p>Válassz kávét:</p>
            <button class="coffeeBtn" data-type="espresso">Espresso</button>
            <button class="coffeeBtn" data-type="latte">Latte</button>
        </div>

        <div id="status">Várakozás érmére...</div>

        <button id="takeBtn" class="hidden">☕ Kávé elvétele</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
