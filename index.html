<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>3D Caffe Automata</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial; }
#ui{
position:absolute;
top:20px;
left:20px;
background: rgba(255,255,255,0.8);
padding:10px 20px;
border-radius:10px;
}
</style>
</head>
<body>
<div id="ui">Dobd be az érmét!</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

// Scene & camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f4);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7);
scene.add(light);

// Machine
const machine = new THREE.Mesh(
    new THREE.BoxGeometry(2,3,1),
    new THREE.MeshStandardMaterial({color:0x333333})
);
machine.position.set(1.5,0,0);
scene.add(machine);

// Coin
const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.3,0.1,32),
    new THREE.MeshStandardMaterial({color:0xffd700})
);
coin.rotation.x = Math.PI/2;
coin.position.set(-2,0,0);
scene.add(coin);

// UI
const uiText = document.getElementById("ui");

// Drag
let selectedObject = null;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("mousedown", e => {
    updateMouse(e);
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects([coin]);
    if(intersects.length>0) selectedObject = coin;
});

window.addEventListener("mousemove", e => {
    if(!selectedObject) return;
    updateMouse(e);
    raycaster.setFromCamera(mouse, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0,0,1), -selectedObject.position.z);
    const point = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, point);
    selectedObject.position.copy(point);

    // Coin insert check
    if(selectedObject.position.distanceTo(machine.position)<1){
        uiText.innerText = "Érme bent! ☕";
    }
});

window.addEventListener("mouseup", ()=> selectedObject=null);

function updateMouse(e){
    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;
}

// Animate
function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
